name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local development (Node 24, npm 11). npm 10, bundled with Node 22,
          # rejects the lock file because it leaves out an optional peer (lru-cache).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
